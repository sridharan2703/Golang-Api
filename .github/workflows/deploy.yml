name: Deploy Development to Production

permissions:
  contents: write

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ✅ Auto Increment Version
      - name: Auto Increment Version
        id: version
        run: |
          echo "🔍 Fetching existing tags..."
          git fetch --tags

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "🕒 Last version: $LAST_TAG"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"

          echo "🚀 New version: $NEW_TAG"
          echo "new_version=$NEW_TAG" >> $GITHUB_OUTPUT

      # ✅ Safe Tag Push (No Duplicate Failure)
      - name: Create & Push Git Tag (Safe)
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          echo "🏷 Creating tag: $NEW_VERSION"

          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "⚠️ Tag already exists. Skipping."
          else
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
            echo "✅ Tag pushed successfully."
          fi

      # ✅ ✅ ✅ REAL DEPLOYMENT VIA SSH ✅ ✅ ✅
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🌀 Deploying version ${{ steps.version.outputs.new_version }} ..."

            cd /home/user/hr_github || exit 1

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/development
            git pull origin development

            echo "📦 Cleaning dependencies..."
            /usr/local/go/bin/go mod tidy
            /usr/local/go/bin/go mod download

            echo "📦 Building Go project..."
            /usr/local/go/bin/go build -o hrserver main.go

            echo "🔍 Stopping old server on port 2703..."
            PID=$(lsof -t -i:2703 || echo "")
            if [ ! -z "$PID" ]; then
              kill -9 $PID || true
              sleep 2
            fi

            echo "🚀 Starting new server..."
            nohup ./hrserver > hr.log 2>&1 &

            sleep 3
            NEW_PID=$(lsof -t -i:2703 || echo "")
            if [ ! -z "$NEW_PID" ]; then
              echo "✅ Server started successfully with PID: $NEW_PID"
            else
              echo "❌ Server failed to start"
              tail -20 hr.log || true
              exit 1
            fi

            echo "🎉 Deployment completed successfully!"
