name: Deploy Development to Production

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy on Production
        run: |
          echo "🌀 Pulling latest development branch..."
          cd /home/user/hr_github
          git fetch --all
          git reset --hard origin/development
          git pull origin development

          echo "📦 Building Go project..."
          /usr/local/go/bin/go build -o hrserver main.go

          echo "🔄 Restarting HR service..."
          sudo systemctl restart hr.service

          echo "✅ Deployment complete!"
