name: Deploy Development to Production with GitHub Datewise Backupnew

permissions:
  contents: write

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ✅ AUTO VERSION
      - name: Auto Increment Version
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Last version: $LAST_TAG"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"

          DATE_TIME=$(date +"%Y-%m-%d_%H-%M-%S")

          echo "new_version=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "old_version=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "backup_datetime=$DATE_TIME" >> $GITHUB_OUTPUT

      # ✅ SAFE NEW VERSION TAG
      - name: Create & Push New Version Tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag exists. Skipping."
          else
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
          fi

      # ✅ ✅ ✅ CREATE DATEWISE ZIP BACKUP ✅ ✅ ✅
     - name: Create ZIP Backup (Version + Datewise)
        run: |
          # ✅ Auto-install zip if missing
          if ! command -v zip &> /dev/null; then
            echo "Installing zip..."
            sudo yum install -y zip || sudo apt install -y zip
          fi

          OLD_VERSION="${{ steps.version.outputs.old_version }}"
          BACKUP_TIME="${{ steps.version.outputs.backup_datetime }}"

          BACKUP_DIR="backup/$OLD_VERSION/$BACKUP_TIME"
          ZIP_PATH="$BACKUP_DIR/source.zip"

          mkdir -p "$BACKUP_DIR"

          echo "📦 Creating ZIP backup at: $ZIP_PATH"

          zip -r "$ZIP_PATH" ./ -x ".git/*"

          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV


      # ✅ ✅ ✅ UPLOAD ZIP TO GITHUB RELEASE ✅ ✅ ✅
      - name: Upload Backup ZIP to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.old_version }}
          name: Backup ${{ steps.version.outputs.old_version }}
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ ✅ ✅ DEPLOY ON SERVER (SELF-HOSTED) ✅ ✅ ✅
      - name: Deploy on Production (Self-Hosted)
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          echo "Deploying version $NEW_VERSION ..."

          cd /home/user/hr_github || exit 1

          git fetch --all
          git reset --hard origin/development
          git pull origin development

          /usr/local/go/bin/go mod tidy
          /usr/local/go/bin/go mod download
          /usr/local/go/bin/go build -o hrserver main.go

          PID=$(lsof -t -i:2703 || echo "")
          if [ ! -z "$PID" ]; then
            kill -9 $PID || true
            sleep 3
          fi

          setsid ./hrserver > hr.log 2>&1 < /dev/null &

          sleep 5
          NEW_PID=$(lsof -t -i:2703 || echo "")
          if [ -z "$NEW_PID" ]; then
            echo "Server failed to start"
            exit 1
          fi

          echo "✅ Deployment successful with version $NEW_VERSION"
