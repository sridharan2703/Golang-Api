name: Deploy Development to Production with Per-Version GitHub Backup

permissions:
  contents: write

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ✅ AUTO VERSION
      - name: Auto Increment Version
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Last version: $LAST_TAG"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"

          DATE_TIME=$(date +"%Y-%m-%d_%H-%M-%S")

          echo "new_version=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "backup_datetime=$DATE_TIME" >> $GITHUB_OUTPUT

      # ✅ CREATE & PUSH NEW VERSION TAG (EACH VERSION)
      - name: Create & Push New Version Tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "⚠️ Tag already exists. Skipping."
          else
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
            echo "✅ New version tag created: $NEW_VERSION"
          fi

      # ✅ ✅ ✅ CREATE TAR BACKUP FOR *THIS VERSION ONLY* ✅ ✅ ✅
      - name: Create TAR Backup (Per Version + Datewise)
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          BACKUP_TIME="${{ steps.version.outputs.backup_datetime }}"

          BACKUP_DIR="backup/$VERSION/$BACKUP_TIME"
          TAR_PATH="$BACKUP_DIR/source.tar.gz"

          mkdir -p "$BACKUP_DIR"

          echo "📦 Creating TAR backup for $VERSION at:"
          echo "    $TAR_PATH"

          tar --exclude='.git' -czf "$TAR_PATH" .

          echo "TAR_PATH=$TAR_PATH" >> $GITHUB_ENV

      # ✅ ✅ ✅ UPLOAD BACKUP TO *THE SAME VERSION RELEASE* ✅ ✅ ✅
      - name: Upload Backup TAR to GitHub Release (Per Version)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Backup ${{ steps.version.outputs.new_version }}
          files: ${{ env.TAR_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ ✅ ✅ DEPLOY ON SERVER (SELF-HOSTED) ✅ ✅ ✅
      - name: Deploy on Production (Self-Hosted)
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          echo "🚀 Deploying version $NEW_VERSION ..."

          cd /home/user/hr_github || exit 1

          git fetch --all
          git reset --hard origin/development
          git pull origin development

          /usr/local/go/bin/go mod tidy
          /usr/local/go/bin/go mod download
          /usr/local/go/bin/go build -o hrserver main.go

          PID=$(lsof -t -i:2703 || echo "")
          if [ ! -z "$PID" ]; then
            kill -9 $PID || true
            sleep 3
          fi

          setsid ./hrserver > hr.log 2>&1 < /dev/null &

          sleep 5
          NEW_PID=$(lsof -t -i:2703 || echo "")
          if [ -z "$NEW_PID" ]; then
            echo "❌ Server failed to start"
            exit 1
          fi

          echo "✅ Deployment successful with version $NEW_VERSION"
